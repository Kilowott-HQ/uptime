# ---------------------------------------------------------------------------
# Confirm Down Alerts — defer-and-confirm Slack notifier
# ---------------------------------------------------------------------------
# Pairs with uptime.yml / uptime-playwright.yml. When those workflows detect
# a `code: 0` down flip, they write a marker to .alerts/pending/<slug>.yml
# and skip Slack. This workflow runs offset from the uptime cron (minute 2,
# 7, 12...) and re-reads current history/<slug>.yml. If site is still down
# after ~6 min, ping Slack. If recovered, silently drop the marker.
#
# TWO ANTI-FALSE-POSITIVE GATES before Slack fires:
#   1. External re-probe (check-host.net multi-node) — the runner's view
#      alone is not enough. If any external node sees UP, silent-resolve
#      (runner-blocked, not real outage). Handles Hostinger/CDN blocking
#      Azure IP range. Async: request → wait 8s → poll result.
#   2. Cooldown (COOLDOWN_SECONDS) — after Slack fires for slug X, block
#      further down pings for X within window. Prevents repeat noise from
#      a flapping site. Recovery ("up") pings unaffected.
#
# COMMIT TAG: all commits from this workflow MUST end in [marker] (NOT
# [upptime]) so the uptime notify grep `\[upptime\]$` cannot match and
# create an infinite Slack loop.
# ---------------------------------------------------------------------------

name: Confirm Down Alerts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the actual Slack POST — log the payload only. Use for verification testing.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: confirm-alerts
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Confirm pending down alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          markers=(.alerts/pending/*.yml)
          if [ ${#markers[@]} -eq 0 ]; then
            echo "No pending markers — nothing to confirm."
            exit 0
          fi

          git fetch origin master --quiet
          mkdir -p .alerts/recent-alerts
          now_ts=$(date -u +%s)
          AGE_THRESHOLD=360        # 6 minutes — min age before considering Slack
          STALE_THRESHOLD=7200     # 2 hours — force-resolve stuck markers
          COOLDOWN_SECONDS=1800    # 30 minutes — post-ping quiet window per slug

          changed=0
          failed=0
          for marker in "${markers[@]}"; do
            slug=$(basename "$marker" .yml)
            first_seen=$(yq -r '.first_seen' "$marker")
            subject=$(yq -r '.subject' "$marker")
            commit_url=$(yq -r '.commit_url' "$marker")
            new_status=$(yq -r '.new_status // "down"' "$marker")
            url=$(yq -r '.url' "$marker")
            seen_ts=$(date -u -d "$first_seen" +%s)
            age=$((now_ts - seen_ts))

            echo "[check] slug=$slug age=${age}s"

            if [ "$age" -lt "$AGE_THRESHOLD" ]; then
              echo "[wait] $slug — age ${age}s < ${AGE_THRESHOLD}s. Leaving marker."
              continue
            fi

            # Read current status from origin/master (post any concurrent uptime tick).
            current_status=$(git show "origin/master:history/${slug}.yml" 2>/dev/null \
              | grep -E '^status:' | awk '{print $2}' || echo unknown)

            if [ "$current_status" = "up" ]; then
              echo "[resolve] $slug — recovered per history. Silent delete marker."
              git rm -f "$marker"
              changed=1
              continue
            fi

            if [ "$age" -ge "$STALE_THRESHOLD" ]; then
              echo "[stale] $slug — marker >${STALE_THRESHOLD}s old, force-resolving."
              git rm -f "$marker"
              changed=1
              continue
            fi

            # Gate 1: external re-probe via check-host.net. Multi-node, no auth.
            # Rationale: our Azure runner may be firewall-blocked (Hostinger /
            # CDN Bot Management etc) while the site is genuinely reachable from
            # the wider internet. If ANY external node sees UP with 2xx HTTP,
            # we treat the runner-view as unreliable and silent-resolve.
            # Fail-open: if the external check itself errors, proceed to Gate 2.
            url_enc=$(printf %s "$url" | jq -sRr @uri)
            req_json=$(curl -s --max-time 15 -H "Accept: application/json" \
              "https://check-host.net/check-http?host=${url_enc}&max_nodes=3" || echo '{}')
            req_id=$(echo "$req_json" | jq -r '.request_id // empty' 2>/dev/null || echo "")
            ext_up=0
            ext_reported=0
            if [ -n "$req_id" ]; then
              sleep 8
              result_json=$(curl -s --max-time 15 -H "Accept: application/json" \
                "https://check-host.net/check-result/${req_id}" || echo '{}')
              # Each node's value is either null (not reported) or an array like
              # [[success, response_time, "OK", "200", "ip"]]. Count node-results
              # where success==1 AND http status starts with 2.
              ext_up=$(echo "$result_json" | jq '[.[] | select(. != null) | .[0] | select(.[0]==1 and (.[3] // "" | tostring | startswith("2")))] | length' 2>/dev/null || echo 0)
              ext_reported=$(echo "$result_json" | jq '[.[] | select(. != null)] | length' 2>/dev/null || echo 0)
            fi
            echo "[external-probe] $slug up=${ext_up} reported=${ext_reported} req_id=${req_id:-none}"
            if [ "$ext_up" -gt 0 ]; then
              echo "[external-up] $slug — external sees UP. Runner-blocked, not real outage. Silent-resolve."
              git rm -f "$marker"
              changed=1
              continue
            fi

            # Gate 2: cooldown. If we already fired a Slack down-ping for this
            # slug in the last COOLDOWN_SECONDS, suppress refire. Recovery pings
            # are unaffected — this gate only covers repeat *down* alerts.
            cooldown_file=".alerts/recent-alerts/${slug}.yml"
            if [ -f "$cooldown_file" ]; then
              last_alerted=$(yq -r '.alerted_at' "$cooldown_file" 2>/dev/null || echo "")
              if [ -n "$last_alerted" ]; then
                last_ts=$(date -u -d "$last_alerted" +%s 2>/dev/null || echo 0)
                since_last=$((now_ts - last_ts))
                if [ "$since_last" -lt "$COOLDOWN_SECONDS" ]; then
                  echo "[cooldown] $slug — last alerted ${since_last}s ago (< ${COOLDOWN_SECONDS}s). Suppress refire. Silent-resolve marker."
                  git rm -f "$marker"
                  changed=1
                  continue
                fi
              fi
            fi

            # Still down, external agrees down, cooldown clear — ping Slack now.
            clean="${subject% \[upptime\]}"
            clean="${clean% \[skip ci\]}"
            mention="<!channel> "
            first_seen_human=$(date -u -d "$first_seen" +"%Y-%m-%d %H:%M:%S UTC")
            payload=$(jq -n --arg text "$(printf '%s*%s*\nDetected: %s' "${mention}" "${clean}" "${first_seen_human}")" '{"text": $text}')
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "[DRY-RUN] would POST to Slack: ${clean} | first_seen=${first_seen_human}"
              echo "[DRY-RUN] payload: ${payload}"
              http_code=200
            else
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                -X POST "${SLACK_WEBHOOK_URL}" \
                -H "Content-Type: application/json" \
                -d "${payload}" || echo "000")
            fi
            echo "[notify-confirmed] ${clean} → HTTP ${http_code}"
            if [ "${http_code}" != "200" ]; then
              failed=$((failed + 1))
            else
              # Record alert time for cooldown gate on future flapping cycles.
              alerted_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              printf 'slug: %s\nurl: %s\nalerted_at: %s\n' "$slug" "$url" "$alerted_at" > ".alerts/recent-alerts/${slug}.yml"
              git add ".alerts/recent-alerts/${slug}.yml"
              git rm -f "$marker"
              changed=1
            fi

            # WhatsApp alert on confirmed down (secondary channel, log-only on failure)
            wa_body="${slug} ${new_status} since ${first_seen}"
            wa_http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
              -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
              -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
              --data-urlencode "From=${TWILIO_WHATSAPP_FROM}" \
              --data-urlencode "To=${TWILIO_WHATSAPP_TO}" \
              --data-urlencode "Body=${wa_body}" || echo "000")
            echo "[whatsapp] ${slug} ${new_status} → HTTP ${wa_http_code}"
          done

          # Purge cooldown records older than 24h — bounds the directory size.
          # Site count is O(50); files are tiny; this keeps the tree tidy.
          if compgen -G ".alerts/recent-alerts/*.yml" > /dev/null; then
            purge_cutoff=$((now_ts - 86400))
            for f in .alerts/recent-alerts/*.yml; do
              rec_at=$(yq -r '.alerted_at // empty' "$f" 2>/dev/null || echo "")
              [ -z "$rec_at" ] && continue
              rec_ts=$(date -u -d "$rec_at" +%s 2>/dev/null || echo 0)
              if [ "$rec_ts" -lt "$purge_cutoff" ]; then
                echo "[purge] cooldown record $(basename "$f" .yml) — ${rec_at} > 24h old"
                git rm -f "$f"
                changed=1
              fi
            done
          fi

          if [ "$changed" -gt 0 ]; then
            git config user.name "Upptime Bot"
            git config user.email "73812536+upptime-bot@users.noreply.github.com"
            git commit -m "confirm-alerts: resolve markers [skip ci] [marker]"
            git pull --rebase origin master --quiet || true
            git push origin HEAD:master
          fi

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
