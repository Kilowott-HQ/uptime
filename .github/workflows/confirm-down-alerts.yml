# ---------------------------------------------------------------------------
# Confirm Down Alerts — defer-and-confirm Slack notifier
# ---------------------------------------------------------------------------
# Pairs with uptime.yml / uptime-playwright.yml. When those workflows detect
# a `code: 0` down flip, they write a marker to .alerts/pending/<slug>.yml
# and skip Slack. This workflow runs offset from the uptime cron (minute 2,
# 7, 12...) and re-reads current history/<slug>.yml. If site is still down
# after ~6 min, ping Slack. If recovered, silently drop the marker.
#
# THREE ANTI-FALSE-POSITIVE GATES before Slack fires:
#   1. External re-probe (check-host.net multi-node) — the runner's view
#      alone is not enough. If any external node sees UP, silent-resolve
#      (runner-blocked, not real outage). Handles Hostinger/CDN blocking
#      Azure IP range. Async: request → wait 8s → poll result.
#      Shared via .github/scripts/alert-gates.sh.
#   2. Cooldown (per-site, defaults 30 min; `flappy`-tagged sites e.g. fomo
#      use 24h via .alerts/config/<slug>.yml) — after Slack fires for slug
#      X, block further down pings for X within the window. Prevents
#      repeat noise from a chronically flapping origin. Recovery ("up")
#      pings unaffected — they pair with the recorded down-alert (see
#      pairing invariant in uptime.yml). Shared via alert-gates.sh.
#
#      Cooldown state lives in .alerts/alert-log/<slug>.yml (PERSISTENT —
#      NOT cleared by clear_alert). Kept separate from the pairing record
#      in .alerts/recent-alerts/ because pairing IS cleared by recovery,
#      and tying cooldown to that would reset it every cycle.
#
#      SAFETY NET: escalation gate. If cooldown silenced an alert but the
#      outage has now persisted 60+ min (ESCALATION_THRESHOLD), fire a
#      distinct STILL-down ping regardless of cooldown. Guarantees we
#      never miss a real long outage inside the cooldown window.
#   3. Fresh runner re-check — do a live curl RIGHT NOW from confirm-down's
#      runner. If site returns 2xx/3xx, the outage is already over and
#      alerting has nothing actionable to say. Handles the coo.no /
#      Servebolt edge-network pattern where TCP-level unreachability
#      clears within a few minutes and monitoring history has lagged.
#      Inline (not shared) because it's specific to this workflow's
#      "confirm at check time" semantics.
#
# COMMIT TAG: all commits from this workflow MUST end in [marker] (NOT
# [upptime]) so the uptime notify grep `\[upptime\]$` cannot match and
# create an infinite Slack loop.
# ---------------------------------------------------------------------------

name: Confirm Down Alerts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_run:
    # GitHub's scheduled-workflow cron is unreliable (observed 3h+ gaps on
    # 2026-07-13). Add a workflow_run trigger so confirm-down also fires
    # after every uptime tick — same 5-min cadence, but coupled to real
    # runs rather than the flaky cron. Concurrency below prevents overlap.
    workflows: ["Uptime CI", "Uptime CI — Playwright"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the actual Slack POST — log the payload only. Use for verification testing.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: confirm-alerts
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    # Bumped from 5 → 10 min: diagnostic capture on real down can add up to
    # ~4 min of network probing (traceroute + mtr each cap at 90s, plus curl
    # and nc). 10 min gives comfortable margin without slowing typical runs
    # (fast path — no pending markers or already-resolved — still exits in
    # seconds; the extra ceiling only applies when capturing an actual incident).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Confirm pending down alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # shellcheck source=../scripts/alert-gates.sh
          source .github/scripts/alert-gates.sh

          markers=(.alerts/pending/*.yml)
          if [ ${#markers[@]} -eq 0 ]; then
            echo "No pending markers — nothing to confirm."
            exit 0
          fi

          git fetch origin master --quiet
          mkdir -p .alerts/recent-alerts
          now_ts=$(date -u +%s)
          AGE_THRESHOLD=360         # 6 minutes — min age before considering Slack
          ESCALATION_THRESHOLD=3600 # 60 minutes — fire STILL-down ping if
                                    # a marker's outage has persisted this long
                                    # AND cooldown was silencing the alert.
                                    # Safety net for the cooldown gate — never
                                    # miss a real long outage.
          STALE_THRESHOLD=86400     # 24 hours — force-resolve stuck markers.
                                    # Raised from 2h so cooldown-silenced
                                    # markers persist long enough for the
                                    # escalation gate to catch a genuine
                                    # multi-hour outage. A stuck marker at
                                    # this age is a real bug, not a live
                                    # incident.

          changed=0
          failed=0
          for marker in "${markers[@]}"; do
            slug=$(basename "$marker" .yml)
            first_seen=$(yq -r '.first_seen' "$marker")
            subject=$(yq -r '.subject' "$marker")
            commit_url=$(yq -r '.commit_url' "$marker")
            new_status=$(yq -r '.new_status // "down"' "$marker")
            url=$(yq -r '.url' "$marker")
            seen_ts=$(date -u -d "$first_seen" +%s)
            age=$((now_ts - seen_ts))

            echo "[check] slug=$slug age=${age}s"

            if [ "$age" -lt "$AGE_THRESHOLD" ]; then
              echo "[wait] $slug — age ${age}s < ${AGE_THRESHOLD}s. Leaving marker."
              continue
            fi

            # Read current status from origin/master (post any concurrent uptime tick).
            current_status=$(git show "origin/master:history/${slug}.yml" 2>/dev/null \
              | grep -E '^status:' | awk '{print $2}' || echo unknown)

            if [ "$current_status" = "up" ]; then
              echo "[resolve] $slug — recovered per history. Silent delete marker."
              git rm -f "$marker"
              changed=1
              continue
            fi

            if [ "$age" -ge "$STALE_THRESHOLD" ]; then
              echo "[stale] $slug — marker >${STALE_THRESHOLD}s old, force-resolving."
              git rm -f "$marker"
              changed=1
              continue
            fi

            # Gate 1: external re-probe (check-host.net multi-node). Silent-
            # resolve if any external node sees the site UP.
            if check_external_up "$url"; then
              echo "[external-up] $slug — external sees UP. Silent-resolve."
              git rm -f "$marker"
              changed=1
              continue
            fi

            # Gate 2: cooldown. Suppress refire within cooldown window of a
            # previous down-alert for the same slug. Per-site override via
            # .alerts/config/<slug>.yml (see: fomo, tagged `flappy`, 6h
            # cooldown).
            #
            # Under cooldown we DO NOT silent-resolve the marker anymore.
            # Keeping it lets the escalation gate below catch a genuine
            # long outage inside the cooldown window. The marker will be
            # cleaned up when either:
            #   - the site actually recovers (resolve branch above), or
            #   - escalation fires (see below), or
            #   - STALE_THRESHOLD hits (24h — a real bug, not a live incident).
            if check_cooldown_active "$slug"; then
              escalated_at=$(yq -r '.escalated_at // empty' "$marker" 2>/dev/null || echo "")
              if [ -z "$escalated_at" ] && [ "$age" -ge "$ESCALATION_THRESHOLD" ]; then
                # ESCALATION: cooldown was silencing this alert, but the outage
                # has now persisted 60+ min. Fire a distinct STILL-down ping
                # so we can't ever miss a real long outage just because a
                # short flap earlier put us in cooldown.
                echo "[escalate] $slug — down ${age}s ≥ ${ESCALATION_THRESHOLD}s during cooldown. STILL-down ping."
                clean_still="🟥 ${slug} STILL down (${age}s = $((age/60)) min since ${first_seen})"
                mention_still="<!channel> "
                first_seen_human_still=$(date -u -d "$first_seen" +"%Y-%m-%d %H:%M:%S UTC")
                diag_ts_still=$(date -u +%Y%m%dT%H%M%SZ)
                diag_url_still="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/.diagnostics/${slug}-${diag_ts_still}.md"
                payload_still=$(jq -n --arg text "$(printf '%s*%s*\nFirst seen down: %s\nDiagnostics: %s' "${mention_still}" "${clean_still}" "${first_seen_human_still}" "${diag_url_still}")" '{"text": $text}')
                if [ "${{ inputs.dry_run }}" = "true" ]; then
                  echo "[DRY-RUN] would POST escalation to Slack: ${clean_still}"
                  esc_http_code=200
                else
                  esc_http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                    --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                    -X POST "${SLACK_WEBHOOK_URL}" \
                    -H "Content-Type: application/json" \
                    -d "${payload_still}" || echo "000")
                fi
                echo "[notify-escalation] ${clean_still} → HTTP ${esc_http_code}"
                if [ "${esc_http_code}" = "200" ]; then
                  # Stamp escalated_at on the marker so we don't re-fire on
                  # subsequent ticks, and record_alert to refresh the
                  # cooldown clock (extends suppression window by another
                  # full cooldown from now).
                  now_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  {
                    echo "url: ${url}"
                    echo "subject: ${subject}"
                    echo "commit_url: ${commit_url}"
                    echo "first_seen: ${first_seen}"
                    echo "new_status: ${new_status}"
                    echo "escalated_at: ${now_iso}"
                  } > "$marker"
                  git add "$marker"
                  record_alert "$slug" "$url"
                  changed=1
                  # WhatsApp mirrors Slack for escalation.
                  wa_body_still="${slug} STILL down $((age/60))min since ${first_seen}"
                  wa_esc_code=$(curl -s -o /dev/null -w "%{http_code}" \
                    --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                    -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
                    -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
                    --data-urlencode "From=${TWILIO_WHATSAPP_FROM}" \
                    --data-urlencode "To=${TWILIO_WHATSAPP_TO}" \
                    --data-urlencode "Body=${wa_body_still}" || echo "000")
                  echo "[whatsapp-escalation] ${slug} → HTTP ${wa_esc_code}"
                else
                  failed=$((failed + 1))
                fi
              else
                echo "[cooldown] $slug — silenced (marker kept for escalation/recovery check)."
              fi
              continue
            fi

            # Gate 3: fresh runner-side re-check.
            #
            # By the time we get here, the marker is 6+ min old and the failure
            # was independently confirmed by check-host.net at flip time. But
            # short-lived TCP blips (Servebolt edge/network for coo.no is the
            # canonical case) often clear within a few minutes. If the site is
            # reachable NOW from this runner, silent-resolve — the outage is
            # already over and there's nothing actionable to alert on.
            #
            # Accepts 2xx OR 3xx as reachable (301 redirects are valid too).
            # `|| echo "000"` never fails on curl error → still down → alerts fire.
            runner_recheck=$(curl -sL -o /dev/null -w "%{http_code}" \
              -A "Mozilla/5.0 (compatible; KilowottUptime/1.0; +https://github.com/Kilowott-HQ/uptime)" \
              --max-time 15 "$url" 2>/dev/null || echo "000")
            echo "[runner-recheck] $slug $url → HTTP $runner_recheck"
            if echo "$runner_recheck" | grep -qE '^[23][0-9][0-9]$'; then
              echo "[runner-up] $slug — reachable from confirm-down's runner NOW ($runner_recheck). Outage cleared. Silent-resolve."
              git rm -f "$marker"
              changed=1
              continue
            fi

            # Still down, external agrees down, cooldown clear, runner re-check
            # confirms unreachable — ping Slack now.
            clean="${subject% \[upptime\]}"
            clean="${clean% \[skip ci\]}"
            mention="<!channel> "
            first_seen_human=$(date -u -d "$first_seen" +"%Y-%m-%d %H:%M:%S UTC")
            # Predict the diagnostic file URL so it can be included in the Slack
            # alert. The actual file is captured in a defensive subshell after
            # the Slack POST + WhatsApp — if capture fails, this URL 404s but
            # alerting is unaffected (URL is just a convenience link).
            diag_ts=$(date -u +%Y%m%dT%H%M%SZ)
            diag_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/.diagnostics/${slug}-${diag_ts}.md"
            payload=$(jq -n --arg text "$(printf '%s*%s*\nDetected: %s\nDiagnostics: %s' "${mention}" "${clean}" "${first_seen_human}" "${diag_url}")" '{"text": $text}')
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "[DRY-RUN] would POST to Slack: ${clean} | first_seen=${first_seen_human}"
              echo "[DRY-RUN] payload: ${payload}"
              http_code=200
            else
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                -X POST "${SLACK_WEBHOOK_URL}" \
                -H "Content-Type: application/json" \
                -d "${payload}" || echo "000")
            fi
            echo "[notify-confirmed] ${clean} → HTTP ${http_code}"
            if [ "${http_code}" != "200" ]; then
              failed=$((failed + 1))
            else
              record_alert "$slug" "$url"
              git rm -f "$marker"
              changed=1
            fi

            # WhatsApp alert on confirmed down (secondary channel, log-only on failure)
            wa_body="${slug} ${new_status} since ${first_seen}"
            wa_http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
              -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
              -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
              --data-urlencode "From=${TWILIO_WHATSAPP_FROM}" \
              --data-urlencode "To=${TWILIO_WHATSAPP_TO}" \
              --data-urlencode "Body=${wa_body}" || echo "000")
            echo "[whatsapp] ${slug} ${new_status} → HTTP ${wa_http_code}"

            # Network-path diagnostic capture — writes traceroute, verbose curl,
            # DNS resolution, and runner metadata to .diagnostics/<slug>-<ts>.md
            # so the file the Slack alert already links to actually exists.
            # Only runs on confirmed down (Slack HTTP 200) and outside dry_run.
            #
            # Entire capture is wrapped in a subshell with `set +e` — none of
            # these tools failing (traceroute needs root, mtr may not exist,
            # curl may time out) can affect the outer workflow. If capture
            # fails entirely, the Slack link 404s but alerting is unaffected.
            #
            # Purpose: hand Servebolt / other hosting support tickets a full
            # network-path snapshot from the moment the failure was observed,
            # not the current-time snapshot they'd get if we investigated
            # later after the incident already recovered.
            if [ "${http_code}" = "200" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              (
                set +e
                # Install traceroute if missing. ubuntu-latest ships mtr, dig,
                # curl, nc — but NOT traceroute (verified across 4 prior
                # diagnostic captures where every "TCP traceroute" section
                # printed "command not found"). Servebolt's Aug 2026 reply
                # explicitly asked for traceroute output for future incidents.
                # Failure is non-fatal — if apt-get can't install, the
                # existing "traceroute failed or unavailable" fallback still
                # prints in the diagnostic file. Never breaks the workflow.
                if ! command -v traceroute >/dev/null 2>&1; then
                  sudo apt-get install -y traceroute >/dev/null 2>&1 \
                    || echo "[diagnostic] traceroute install failed — proceeding without"
                fi
                mkdir -p .diagnostics
                diag_file=".diagnostics/${slug}-${diag_ts}.md"
                host=$(echo "$url" | sed -E 's|https?://||; s|/.*||')
                capture_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                {
                  echo "# Diagnostic capture: ${slug}"
                  echo ""
                  echo "- **Slug:** \`$slug\`"
                  echo "- **URL:** ${url}"
                  echo "- **Host:** \`${host}\`"
                  echo "- **First seen down:** ${first_seen}"
                  echo "- **Diagnostic captured at:** ${capture_iso}"
                  echo "- **Marker age at capture:** ${age}s"
                  echo "- **Captured from:** GitHub Actions ubuntu-latest runner"
                  echo ""
                  echo "## Runner external IP"
                  echo '```'
                  curl -s --max-time 10 ifconfig.me 2>&1 || echo "(unavailable)"
                  echo ""
                  echo '```'
                  echo ""
                  echo "## DNS resolution (dig)"
                  echo '```'
                  dig +short "$host" 2>&1 | head -20 || echo "(dig failed)"
                  echo '```'
                  echo ""
                  echo "## TCP connect test to :443 (nc -zv)"
                  echo '```'
                  timeout 15 nc -zv -w 5 "$host" 443 2>&1 || echo "(nc failed or timed out)"
                  echo '```'
                  echo ""
                  echo "## Verbose curl to ${url}"
                  echo '```'
                  timeout 35 curl -v --max-time 30 \
                    -A "Mozilla/5.0 (compatible; KilowottUptime/1.0; +https://github.com/Kilowott-HQ/uptime)" \
                    "$url" -o /dev/null 2>&1 | head -120 || echo "(curl failed)"
                  echo '```'
                  echo ""
                  echo "## TCP traceroute to :443 (traceroute -T -p 443)"
                  echo '```'
                  timeout 90 sudo traceroute -T -p 443 -n -m 30 -w 3 "$host" 2>&1 | head -50 || echo "(traceroute failed or unavailable)"
                  echo '```'
                  echo ""
                  echo "## MTR TCP path summary (mtr --tcp --port 443 -c 5)"
                  echo '```'
                  timeout 90 sudo mtr --tcp --port 443 --report --report-cycles 5 --no-dns "$host" 2>&1 | head -50 || echo "(mtr failed or unavailable)"
                  echo '```'
                  echo ""
                  echo "## External confirmation"
                  echo ""
                  echo "This diagnostic was captured from the same runner-class that reported the site down."
                  echo "The confirm-down-alerts workflow's Gate 1 (check-host.net multi-node probe) also"
                  echo "reported this site down from independent international networks at the same moment;"
                  echo "see the workflow run log for the specific request_id and node IPs."
                } > "$diag_file" 2>&1
                if [ -f "$diag_file" ]; then
                  git add "$diag_file" 2>/dev/null || true
                  changed=1
                  echo "[diagnostic] captured ${diag_file}"
                else
                  echo "[diagnostic] capture failed — file not written (Slack link will 404)"
                fi
              ) || true
            fi
          done

          # NOTE: recent-alerts files are NOT auto-purged. They're the pairing
          # state — cleared only when the corresponding "up" recovery fires
          # (via uptime.yml notify path). A sustained outage could keep the
          # file for 24h+; that's correct. Bounded by site count.

          if [ "$changed" -gt 0 ]; then
            git config user.name "Upptime Bot"
            git config user.email "73812536+upptime-bot@users.noreply.github.com"
            git commit -m "confirm-alerts: resolve markers [skip ci] [marker]"
            git pull --rebase origin master --quiet || true
            git push origin HEAD:master
          fi

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
