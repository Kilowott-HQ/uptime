#
# Uptime check via Playwright (headless Chromium) for sites that return 403
# to GitHub Actions Azure IPs due to Cloudflare Bot Fight Mode.
#
# Sites opt in by including the `playwright` tag in .upptimerc.yml.
# Currently: Gutta (gutta.no), Utviklingscoach (utviklingscoach.no).
#
# Shares the `uptime-ci` concurrency group with uptime.yml so history/
# commits never race each other. Slack notify logic is identical to
# uptime.yml — only real status flips (^[+-]status: diff) trigger @channel.

name: Uptime CI — Playwright
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime-playwright]
  workflow_dispatch:

concurrency:
  group: uptime-ci
  cancel-in-progress: false

jobs:
  playwright-check:
    name: Playwright site check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
          # Full history. Shallow clones (default fetch-depth: 1) make the
          # notify step's `git log START_SHA..origin/master` return the
          # entire remote history whenever a merge push extends master past
          # the shallow boundary - Slack then replays every historical
          # state-change commit with its original committer date. Seen once
          # in the wild (Aug 21 2026, PR #386 merge -> July 1 Allgrid pings).
          fetch-depth: 0

      - name: Capture starting SHA
        id: pre_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright + Chromium
        run: |
          npm install playwright --no-save --quiet
          npx playwright install --with-deps chromium

      - name: Write Playwright check script
        run: |
          cat > pw-check.js << 'JSEOF'
          const { chromium } = require('playwright');
          const url = process.argv[2];
          if (!url) {
            console.log(JSON.stringify({ status: 'down', code: 0, responseTime: 0 }));
            process.exit(0);
          }
          (async () => {
            let browser;
            const t0 = Date.now();
            try {
              browser = await chromium.launch({ headless: true });
              const ctx = await browser.newContext({
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
              });
              const page = await ctx.newPage();
              const resp = await page.goto(url, { timeout: 30000, waitUntil: 'domcontentloaded' });
              const elapsed = Date.now() - t0;
              const code = resp ? resp.status() : 0;
              console.log(JSON.stringify({
                status: code >= 200 && code < 400 ? 'up' : 'down',
                code,
                responseTime: elapsed
              }));
            } catch (e) {
              process.stderr.write('PW error: ' + e.message + '\n');
              console.log(JSON.stringify({ status: 'down', code: 0, responseTime: Date.now() - t0 }));
            } finally {
              if (browser) await browser.close();
            }
          })();
          JSEOF

      - name: Check sites via headless Chromium
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import yaml, json, subprocess, os, re, sys
          from datetime import datetime, timezone

          with open('.upptimerc.yml') as f:
              config = yaml.safe_load(f)

          playwright_sites = [
              s for s in config.get('sites', [])
              if 'playwright' in (s.get('tags') or [])
          ]

          if not playwright_sites:
              print('No playwright-tagged sites in .upptimerc.yml — nothing to check')
              sys.exit(0)

          print(f'Checking {len(playwright_sites)} playwright-tagged site(s)...')

          def slugify(name):
              s = name.lower()
              s = re.sub(r'[^\w\s-]', '', s)
              s = re.sub(r'[\s_]+', '-', s)
              s = re.sub(r'-+', '-', s)
              return s.strip('-')

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          os.makedirs('history', exist_ok=True)

          for site in playwright_sites:
              name = site['name']
              url  = site['url']
              slug = slugify(name)
              hist_path = f'history/{slug}.yml'

              print(f'  {name}  ({url})')

              try:
                  result = subprocess.run(
                      ['node', 'pw-check.js', url],
                      capture_output=True, text=True, timeout=60
                  )
                  if result.stderr:
                      print(f'    stderr: {result.stderr.strip()}')
                  raw = result.stdout.strip()
                  data = json.loads(raw) if raw else {}
                  if not data:
                      raise ValueError('empty output from pw-check.js')
              except Exception as e:
                  print(f'    Check error: {e}')
                  data = {'status': 'down', 'code': 0, 'responseTime': 0}

              new_status = data.get('status', 'down')
              code       = data.get('code', 0)
              rt         = data.get('responseTime', 0)
              print(f'    → {new_status}  (HTTP {code},  {rt}ms)')

              hist_data = {}
              if os.path.exists(hist_path):
                  with open(hist_path) as f:
                      hist_data = yaml.safe_load(f) or {}

              hist_data['url']          = url
              hist_data['status']       = new_status
              hist_data['code']         = code
              hist_data['responseTime'] = rt
              hist_data['lastUpdated']  = now
              if 'startTime' not in hist_data:
                  hist_data['startTime'] = now
              hist_data['generator'] = 'Upptime <https://github.com/upptime/upptime>'

              with open(hist_path, 'w') as f:
                  yaml.dump(hist_data, f, allow_unicode=True,
                            sort_keys=False, default_flow_style=False)
              print(f'    History → {hist_path}')
          PYEOF

      - name: Commit and push history
        run: |
          set -euo pipefail

          git add history/*.yml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No history changes — nothing to commit"
            exit 0
          fi

          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git config user.name "Upptime Bot"

          # Build commit message — describe any real status flips
          status_changes=()
          while IFS= read -r f; do
            slug=$(basename "$f" .yml)
            old_status=$(git show HEAD:"$f" 2>/dev/null \
              | grep '^status:' | head -1 | awk '{print $2}' || echo "unknown")
            new_status=$(grep '^status:' "$f" 2>/dev/null \
              | head -1 | awk '{print $2}' || echo "unknown")
            if [ "$old_status" != "$new_status" ]; then
              if [ "$new_status" = "up" ]; then
                status_changes+=("🟩 ${slug} is up (Playwright)")
              else
                status_changes+=("🟥 ${slug} is down (Playwright)")
              fi
            fi
          done < <(git diff --staged --name-only \
              | grep 'history/.*\.yml' | grep -v 'summary' || true)

          if [ ${#status_changes[@]} -gt 0 ]; then
            joined=$(IFS=', '; echo "${status_changes[*]}")
            msg="${joined} [skip ci] [upptime]"
          else
            msg="Playwright: update history [skip ci] [upptime]"
          fi

          git commit -m "$msg"
          git pull --rebase origin master --quiet || true
          git push origin HEAD:master

      - name: Notify Slack on state changes
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          # shellcheck source=../scripts/alert-gates.sh
          source .github/scripts/alert-gates.sh
          START_SHA="${{ steps.pre_sha.outputs.sha }}"
          git fetch origin --quiet
          # --first-parent: skip commits brought in as the second parent of a
          # merge (PR merges bring the branch's private history into the
          # range; those commits already reflect stale state and should not
          # be replayed as new flips).
          # --since="1 hour ago": belt-and-braces freshness clamp - a stale
          # commit surfacing through any other path still can't fire Slack
          # with a July-era %cI timestamp.
          changes=$(git log --first-parent --since="1 hour ago" "${START_SHA}..origin/master" --pretty=format:"%H|%s" | grep -E '\[upptime\]$' | grep -v '|:' || true)
          if [ -z "$changes" ]; then
            echo "No state-change commits — nothing to notify"
            exit 0
          fi
          pending_changes=0
          failed=0
          while IFS='|' read -r sha subject; do
            [ -z "$sha" ] && continue

            # Playwright and (rarely) response-time reruns batch multiple sites
            # into ONE commit. The commit subject names only the first flip;
            # every history/*.yml with a real status flip in the diff must be
            # processed independently, or the wrong slug ends up on the marker.
            # A "real flip" is a file whose diff contains BOTH a -status: and
            # a +status: line (2 distinct values) - responseTime-only refresh
            # touches history/*.yml without producing status: diffs.
            flipped_files=$(git diff-tree --no-commit-id --name-only -r "$sha" -- 'history/*.yml' 2>/dev/null | while read -r f; do
              [ -z "$f" ] && continue
              n=$(git show --no-renames --format= "$sha" -- "$f" | grep -cE '^[+-]status:')
              if [ "$n" -ge 2 ]; then
                echo "$f"
              fi
            done)
            if [ -z "$flipped_files" ]; then
              echo "[skip] $subject — no status field change in diff"
              continue
            fi
            flip_count=$(echo "$flipped_files" | grep -c .)

            while IFS= read -r slug_file; do
              [ -z "$slug_file" ] && continue
              slug=$(basename "$slug_file" .yml)
              # Every field bound to the specific flipped file, not `head -1`
              # across the whole commit.
              new_status=$(git show --no-renames --format= "$sha" -- "$slug_file" | grep -E '^\+status:' | awk '{print $2}')
              new_code=$(git show --no-renames --format= "$sha" -- "$slug_file" | grep -E '^\+code:' | awk '{print $2}')
              new_response=$(git show "${sha}:${slug_file}" 2>/dev/null | grep -E '^responseTime:' | awk '{print $2}')
              url=$(git show "${sha}:${slug_file}" 2>/dev/null | grep -E '^url:' | awk '{print $2}' || echo "")
              marker_path=".alerts/pending/${slug}.yml"
              echo "[gate] sha=$sha slug=$slug new_status=$new_status new_code=$new_code"

              # Transient defer-and-confirm — write marker, skip Slack until confirm-down-alerts.yml
              # verifies the site is still down after one cron tick (~6 min).
              # Defers: code:0 (network failure), any 5xx (502/503/504/etc — transient
              # origin/CDN errors), AND code:403 (Cloudflare Bot Management challenge on
              # the runner IP — often affects multiple CF-fronted sites simultaneously
              # for ~5 min, then clears). Other 4xx (401/404/etc — real client-side
              # errors) bypass and ping immediately. Recovery (status up) deletes any
              # matching marker.
              if [ "${new_status}" = "down" ] && echo "${new_code}" | grep -qE '^(0|403|429|5[0-9][0-9])$'; then
                # Defer. Write marker, no Slack yet.
                first_seen=$(git show -s --format=%cI "$sha")
                mkdir -p .alerts/pending
                {
                  echo "url: ${url}"
                  echo "subject: ${subject}"
                  echo "commit_url: https://github.com/${{ github.repository }}/commit/${sha}"
                  echo "first_seen: ${first_seen}"
                  echo "new_status: ${new_status}"
                } > "$marker_path"
                git add "$marker_path"
                pending_changes=1
                echo "[defer] ${slug} ${new_status} (${new_code}) — marker written. confirm-down-alerts will verify in ~6 min."
                continue
              fi

              # Up flip — pairing invariant. Fire recovery ONLY if the down was
              # previously announced (initial Slack alert OR escalation ping).
              # See uptime.yml for the full rationale of the two announcement
              # paths (recent-alerts / marker's escalated_at).
              if [ "${new_status}" = "up" ]; then
                announced_via_escalation=""
                if [ -f "$marker_path" ]; then
                  announced_via_escalation=$(yq -r '.escalated_at // empty' "$marker_path" 2>/dev/null || echo "")
                  git rm -f "$marker_path"
                  pending_changes=1
                fi
                if [ -z "$announced_via_escalation" ] && ! has_pending_recovery "$slug"; then
                  echo "[suppress] ${slug} up — no down alert was announced (initial or escalation). Silent recovery."
                  continue
                fi
                # Fall through: down WAS announced → owe a paired recovery ping.
              fi

              # Down flip with non-deferred code (401/404/etc). Same gates
              # as confirm-down-alerts before firing.
              if [ "${new_status}" = "down" ]; then
                if check_external_up "$url"; then
                  echo "[external-up] $slug — external sees UP. Runner-blocked, not real outage. No Slack."
                  continue
                fi
                if check_cooldown_active "$slug"; then
                  echo "[cooldown] $slug — recent down alert active. Suppress refire."
                  continue
                fi
              fi

              # Single-flip commits: the commit subject correctly names this
              # slug. Multi-flip commits: subject names only ONE site, so we
              # synthesize a slug-specific label for every other flipped site.
              if [ "$flip_count" -eq 1 ]; then
                clean="${subject% \[upptime\]}"
                clean="${clean% \[skip ci\]}"
              else
                if [ "${new_status}" = "up" ]; then
                  clean="🟩 ${slug} is up (${new_code} in ${new_response} ms)"
                else
                  clean="🟥 ${slug} is down (${new_code} in ${new_response} ms)"
                fi
              fi
              mention="<!channel> "
              flip_iso=$(git show -s --format=%cI "$sha")
              flip_time=$(date -u -d "$flip_iso" +"%Y-%m-%d %H:%M:%S UTC")
              payload=$(jq -n --arg text "$(printf '%s*%s*\nDetected: %s' "${mention}" "${clean}" "${flip_time}")" '{"text": $text}')
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                -X POST "${SLACK_WEBHOOK_URL}" \
                -H "Content-Type: application/json" \
                -d "${payload}" || echo "000")
              echo "[notify] ${clean} → HTTP ${http_code}"
              if [ "${http_code}" != "200" ]; then
                failed=$((failed + 1))
              else
                # Slack succeeded — update pairing state.
                if [ "${new_status}" = "down" ]; then
                  record_alert "$slug" "$url"
                  pending_changes=1
                elif [ "${new_status}" = "up" ]; then
                  clear_alert "$slug"
                  pending_changes=1
                fi
              fi

              # WhatsApp alert (secondary channel, log-only on failure)
              timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              wa_body="${slug} ${new_status} since ${timestamp}"
              wa_http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
                -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
                -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
                --data-urlencode "From=${TWILIO_WHATSAPP_FROM}" \
                --data-urlencode "To=${TWILIO_WHATSAPP_TO}" \
                --data-urlencode "Body=${wa_body}" || echo "000")
              echo "[whatsapp] ${slug} ${new_status} → HTTP ${wa_http_code}"
            done <<< "$flipped_files"
          done <<< "${changes}"
          if [ "${pending_changes}" -gt 0 ]; then
            git config user.name "Upptime Bot"
            git config user.email "73812536+upptime-bot@users.noreply.github.com"
            git commit -m "alert markers updated [skip ci] [marker]"
            git pull --rebase origin master --quiet || true
            git push origin HEAD:master
          fi
          if [ "${failed}" -gt 0 ]; then
            exit 1
          fi
