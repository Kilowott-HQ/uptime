name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Debug — confirm SLACK_WEBHOOK_URL is reaching runner
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "WEBHOOK IS EMPTY"
            exit 1
          else
            echo "WEBHOOK PREFIX: ${SLACK_WEBHOOK_URL:0:40}"
            echo "WEBHOOK LENGTH: ${#SLACK_WEBHOOK_URL}"
            if [[ "$SLACK_WEBHOOK_URL" == https://hooks.slack.com/* ]]; then
              echo "WEBHOOK STARTS WITH https://hooks.slack.com: YES"
            else
              echo "WEBHOOK STARTS WITH https://hooks.slack.com: NO"
            fi
          fi
      - name: Capture starting SHA
        id: pre_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check endpoint status
        # Pinned to v1.41.0 — v1.41.1's node-libcurl binding is compiled
        # against NODE_MODULE_VERSION 115 (Node 20) and breaks on the
        # current runner (Node 24, NODE_MODULE_VERSION 127). v1.41.0 was
        # the last version that ran successfully (04:10 UTC 2026-05-05).
        # Will need re-pinning after each Upptime template-update run.
        uses: upptime/uptime-monitor@v1.41.0
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Notify Slack on state changes
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          START_SHA="${{ steps.pre_sha.outputs.sha }}"
          git fetch origin --quiet
          changes=$(git log "${START_SHA}..origin/master" --pretty=format:"%H|%s" | grep -E '^(🟥|🟩|🟨).*\[upptime\]$' || true)
          if [ -z "$changes" ]; then
            echo "No state-change commits — nothing to notify"
            exit 0
          fi
          failed=0
          while IFS='|' read -r sha subject; do
            [ -z "$sha" ] && continue
            clean="${subject% \[upptime\]}"
            commit_url="https://github.com/${{ github.repository }}/commit/${sha}"
            payload=$(jq -n --arg text "$(printf '*%s*\n%s' "${clean}" "${commit_url}")" '{"text": $text}')
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${payload}")
            echo "[notify] ${clean} → HTTP ${http_code}"
            if [ "${http_code}" != "200" ]; then
              failed=$((failed + 1))
            fi
          done <<< "${changes}"
          if [ "${failed}" -gt 0 ]; then
            exit 1
          fi
