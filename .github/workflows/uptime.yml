#
# Custom Kilowott uptime workflow — DO NOT regenerate from upstream Upptime
# template. The post-monitor steps below (Capture SHA, Reconcile summary,
# Notify Slack) and the status-only filter are not part of the upstream
# template. Setup CI's `Update template` step has been removed and
# update-template.yml has been deleted to prevent regeneration.
#   - code:0 transient gate (re-probes the URL once before Slack alerts)
#   - code:0 down flips defer to confirm-down-alerts.yml (write marker, no Slack)
#   - self-heal .upptimerc.yml after upptime-monitor strips playwright sites
#
# 🔼 Upptime @v1.41.3

name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

# Serialize uptime runs so concurrent dispatches/schedules can't both
# observe the same state-change commit window and double-notify Slack.
concurrency:
  group: uptime-ci
  cancel-in-progress: false

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Capture starting SHA
        id: pre_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Save canonical .upptimerc.yml
        # Snapshot the full site list BEFORE the strip step mutates it. The
        # follow-up "Restore .upptimerc.yml" step at the end of the job uses
        # this to undo any committed strip that upptime-monitor@v1.41.3 made
        # when it auto-pushed the working-tree state.
        #
        # Source is the committed .upptimerc.canonical.yml (NOT the working
        # .upptimerc.yml). This makes the self-heal resilient to a prior run
        # that crashed with a stripped .upptimerc.yml on master — the previous
        # implementation would then persist the stripped state forever because
        # canonical was captured post-strip. Keeping canonical as a separate
        # tracked file breaks that loop; upptime-monitor never touches it.
        run: cp .upptimerc.canonical.yml /tmp/upptimerc.canonical.yml

      - name: Strip Playwright-checked sites from .upptimerc.yml
        # Gutta + Utviklingscoach are tagged `playwright` — they block GitHub Actions
        # Azure IPs via Cloudflare Bot Fight Mode, causing false 403 downtime alerts.
        # Remove them here so Upptime's HTTP-GET checker never sees them.
        # uptime-playwright.yml handles their checks via headless Chromium.
        run: |
          python3 - <<'PYEOF'
          import yaml
          with open('.upptimerc.yml') as f:
              data = yaml.safe_load(f)
          orig = len(data.get('sites', []))
          data['sites'] = [
              s for s in data.get('sites', [])
              if 'playwright' not in (s.get('tags') or [])
          ]
          removed = orig - len(data['sites'])
          with open('.upptimerc.yml', 'w') as f:
              yaml.dump(data, f, allow_unicode=True, sort_keys=False, default_flow_style=False)
          print(f'Stripped {removed} playwright-tagged site(s) — {len(data["sites"])} site(s) remain for HTTP check')
          PYEOF

      - name: Check endpoint status
        id: check_status
        # upptime-monitor@v1.41.3's internal auto-push races with concurrent
        # workflow pushes (uptime-playwright, confirm-down-alerts, etc.) and
        # exits non-zero with "failed to push some refs" — but its history
        # commits land via retries anyway. Tolerate that specific failure
        # class in the follow-up step below; keep real failures loud.
        continue-on-error: true
        uses: upptime/uptime-monitor@v1.41.3
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Fail only on non-push-race errors
        # Runs whenever upptime-monitor exits non-zero. Determines whether
        # the failure was a benign push-race (concurrent workflow pushed
        # first — data still gets through the pipeline) or a real breakage.
        #
        # Heuristic: if ANY commit tagged [upptime] or [marker] landed on
        # origin/master in the recent window, the monitoring pipeline is
        # functioning — treat this run's non-zero exit as benign. Only fail
        # if the whole pipeline appears stalled (no bot activity at all).
        #
        # Why "any tagged commit" instead of path-scoped:
        #   Path-scoped check (history/ + .upptimerc.yml only) was too
        #   strict — a concurrent Playwright push landing SECONDS after
        #   our own push-race failure often hadn't propagated to origin
        #   yet at fetch time, giving 0 count → false real-failure.
        #   Broader "any [upptime]/[marker] commit" heuristic captures
        #   pipeline liveness reliably.
        #
        # The 20s sleep before fetch gives concurrent pushes a moment to
        # propagate on GitHub's side — races are typically resolved in a
        # few seconds, but 20s adds margin without significantly delaying
        # the workflow (steps 8-10 run in parallel via if:always()).
        if: steps.check_status.outcome == 'failure'
        run: |
          set -euo pipefail
          START_SHA="${{ steps.pre_sha.outputs.sha }}"
          echo "[verify] waiting 20s for concurrent workflow pushes to propagate..."
          sleep 20
          git fetch origin master --quiet
          # Count commits tagged [upptime] or [marker] since job start.
          # Grep of the subject line is safe because upptime-monitor and
          # our self-heal always append those tags — we control both.
          new_bot_commits=$(git log "${START_SHA}..origin/master" --pretty=format:"%s" 2>/dev/null \
            | grep -cE '\[(upptime|marker)\]$' || echo 0)
          echo "[verify] bot commits ([upptime] or [marker]) since ${START_SHA:0:7}: ${new_bot_commits}"
          if [ "${new_bot_commits}" -gt 0 ]; then
            echo "[verify] monitoring pipeline is alive on master — treating as benign push-race."
            exit 0
          fi
          echo "[verify] pipeline appears stalled (no bot activity in window) — real failure, propagating."
          exit 1

      - name: Reconcile summary.json status from per-site history
        # Upptime bug: summary.json's `status` field is only refreshed on
        # state-change events. Per-site history/<slug>.yml is the source of
        # truth — rewrite summary.json's status fields from those after each run.
        if: always()
        run: |
          set -euo pipefail
          git fetch origin --quiet
          git checkout origin/master -- history/ || true

          [ -f history/summary.json ] || { echo "No summary.json yet — skip"; exit 0; }

          map="{}"
          for f in history/*.yml; do
            [ -f "$f" ] || continue
            slug=$(basename "$f" .yml)
            [ "$slug" = "summary" ] && continue
            status=$(yq -r '.status // "unknown"' "$f")
            map=$(echo "$map" | jq --arg s "$slug" --arg st "$status" '. + {($s): $st}')
          done

          tmp=$(mktemp)
          jq --argjson map "$map" 'map(. + {status: ($map[.slug] // .status)})' \
             history/summary.json > "$tmp"
          mv "$tmp" history/summary.json

          if git diff --quiet history/summary.json; then
            echo "summary.json already in sync with per-site history."
            exit 0
          fi

          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git config user.name "Upptime Bot"
          git add history/summary.json
          git commit -m ":card_file_box: Reconcile summary.json status from per-site history [skip ci] [upptime]"
          git pull --rebase origin master --quiet || true
          git push origin HEAD:master

      - name: Notify Slack on state changes
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: |
          # shellcheck source=../scripts/alert-gates.sh
          source .github/scripts/alert-gates.sh
          START_SHA="${{ steps.pre_sha.outputs.sha }}"
          git fetch origin --quiet
          changes=$(git log "${START_SHA}..origin/master" --pretty=format:"%H|%s" | grep -E '\[upptime\]$' | grep -v '|:' || true)
          if [ -z "$changes" ]; then
            echo "No state-change commits — nothing to notify"
            exit 0
          fi
          pending_changes=0
          failed=0
          while IFS='|' read -r sha subject; do
            [ -z "$sha" ] && continue

            # Only ping on commits that flip the status: field in history/<slug>.yml.
            # Upptime v1.41.3 also emits `🟩 X is up` commits when only
            # responseTime/lastUpdated refresh (daily Response Time cron).
            # Two distinct +/-status: lines ⇒ real flip. Otherwise skip.
            status_lines=$(git show --no-renames --format= "$sha" -- 'history/*.yml' \
              | grep -E '^[+-]status:' | sort -u)
            status_distinct=$(echo "$status_lines" | grep -c . || true)
            if [ "$status_distinct" -lt 2 ]; then
              echo "[skip] $subject — no status field change in diff"
              continue
            fi

            # Transient defer-and-confirm — write marker, skip Slack until confirm-down-alerts.yml
            # verifies the site is still down after one cron tick (~6 min).
            # Defers: code:0 (network failure), any 5xx (502/503/504/etc — transient
            # origin/CDN errors), AND code:403 (Cloudflare Bot Management challenge on
            # the runner IP — often affects multiple CF-fronted sites simultaneously
            # for ~5 min, then clears). Other 4xx (401/404/etc — real client-side
            # errors) bypass and ping immediately. Recovery (status up) deletes any
            # matching marker.
            new_status=$(git show --no-renames --format= "$sha" -- 'history/*.yml' \
              | grep -E '^\+status:' | head -1 | awk '{print $2}')
            new_code=$(git show --no-renames --format= "$sha" -- 'history/*.yml' \
              | grep -E '^\+code:' | head -1 | awk '{print $2}')
            slug_file=$(git show --no-renames --name-only --format= "$sha" -- 'history/*.yml' | head -1)
            slug=$(basename "$slug_file" .yml)
            marker_path=".alerts/pending/${slug}.yml"
            url=$(git show "${sha}:${slug_file}" 2>/dev/null | grep -E '^url:' | awk '{print $2}' || echo "")
            echo "[gate] sha=$sha slug=$slug new_status=$new_status new_code=$new_code"

            if [ "${new_status}" = "down" ] && echo "${new_code}" | grep -qE '^(0|403|429|5[0-9][0-9])$'; then
              # Defer. Write marker, no Slack yet.
              first_seen=$(git show -s --format=%cI "$sha")
              mkdir -p .alerts/pending
              {
                echo "url: ${url}"
                echo "subject: ${subject}"
                echo "commit_url: https://github.com/${{ github.repository }}/commit/${sha}"
                echo "first_seen: ${first_seen}"
                echo "new_status: ${new_status}"
              } > "$marker_path"
              git add "$marker_path"
              pending_changes=1
              echo "[defer] $subject — marker written. confirm-down-alerts will verify in ~6 min."
              continue
            fi

            # Up flip — pairing invariant. Fire recovery ONLY if the down was
            # previously announced (pending marker OR recent-alerts record).
            # If neither exists, the down was silent → recovery must also be
            # silent (channel has many people; every orphan ping is costly).
            if [ "${new_status}" = "up" ]; then
              if [ -f "$marker_path" ]; then
                git rm -f "$marker_path"
                pending_changes=1
                echo "[suppress] $subject — recovery before confirm tick. No Slack."
                continue
              fi
              if ! has_pending_recovery "$slug"; then
                echo "[suppress] $subject — no matching down alert was announced. Silent recovery."
                continue
              fi
              # recent-alerts exists → down was fired → owe a recovery. Fall through.
            fi

            # Down flip with non-deferred code (401/404/etc). Apply the
            # same gates as confirm-down-alerts before firing. Bias toward
            # silence: only announce down if external agrees + no cooldown.
            if [ "${new_status}" = "down" ]; then
              if check_external_up "$url"; then
                echo "[external-up] $slug — external sees UP. Runner-blocked, not real outage. No Slack."
                continue
              fi
              if check_cooldown_active "$slug"; then
                echo "[cooldown] $slug — recent down alert active. Suppress refire."
                continue
              fi
            fi

            clean="${subject% \[upptime\]}"
            clean="${clean% \[skip ci\]}"
            mention="<!channel> "
            flip_iso=$(git show -s --format=%cI "$sha")
            flip_time=$(date -u -d "$flip_iso" +"%Y-%m-%d %H:%M:%S UTC")
            payload=$(jq -n --arg text "$(printf '%s*%s*\nDetected: %s' "${mention}" "${clean}" "${flip_time}")" '{"text": $text}')
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
              -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "${payload}" || echo "000")
            echo "[notify] ${clean} → HTTP ${http_code}"
            if [ "${http_code}" != "200" ]; then
              failed=$((failed + 1))
            else
              # Slack succeeded — update pairing state.
              if [ "${new_status}" = "down" ]; then
                record_alert "$slug" "$url"
                pending_changes=1
              elif [ "${new_status}" = "up" ]; then
                clear_alert "$slug"
                pending_changes=1
              fi
            fi

            # WhatsApp alert (secondary channel, log-only on failure)
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            wa_body="${slug} ${new_status} since ${timestamp}"
            wa_http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
              -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
              -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
              --data-urlencode "From=${TWILIO_WHATSAPP_FROM}" \
              --data-urlencode "To=${TWILIO_WHATSAPP_TO}" \
              --data-urlencode "Body=${wa_body}" || echo "000")
            echo "[whatsapp] ${slug} ${new_status} → HTTP ${wa_http_code}"
          done <<< "${changes}"
          if [ "${pending_changes}" -gt 0 ]; then
            git config user.name "Upptime Bot"
            git config user.email "73812536+upptime-bot@users.noreply.github.com"
            git commit -m "alert markers updated [skip ci] [marker]"
            git pull --rebase origin master --quiet || true
            git push origin HEAD:master
          fi
          if [ "${failed}" -gt 0 ]; then
            exit 1
          fi

      - name: Restore .upptimerc.yml if upptime-monitor stripped it
        # The strip step earlier in this job mutates .upptimerc.yml so
        # upptime-monitor skips playwright-tagged sites. The action's
        # internal commit step then pushes that stripped state to master,
        # progressively losing playwright sites. This step re-applies the
        # canonical snapshot saved before strip and commits a follow-up
        # restore if drift exists. Uses [marker] (not [upptime]) so the
        # notify-step grep `\[upptime\]$` cannot match.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/upptimerc.canonical.yml ]; then
            echo "canonical snapshot missing — skipping restore"
            exit 0
          fi
          git fetch origin master --quiet
          # Pull origin's current .upptimerc.yml into working tree (post-monitor + post-reconcile state)
          git checkout origin/master -- .upptimerc.yml
          # Overwrite with the canonical snapshot we saved before the strip
          cp /tmp/upptimerc.canonical.yml .upptimerc.yml
          if git diff --quiet -- .upptimerc.yml; then
            echo "No drift between working tree and index — config intact."
            exit 0
          fi
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git add .upptimerc.yml
          # Guard against the cosmetic case: working tree differed from index
          # (because checkout pulled origin/master) but after staging the
          # canonical, the result equals local HEAD — nothing to commit.
          # Happens on ticks where upptime-monitor didn't commit AND a recent
          # push to .upptimerc.yml just synced master to the canonical state.
          if git diff --quiet --cached HEAD -- .upptimerc.yml; then
            echo "Staged content matches HEAD — already in sync with current commit."
            exit 0
          fi
          git commit -m "config: restore playwright sites stripped by upptime-monitor [skip ci] [marker]"
          git pull --rebase origin master --quiet || true
          git push origin HEAD:master
