  graphs: 0 0 * * *
  responseTime: 0 23 * * *
  staticSite: 0 1 * * *
  summary: 0 0 * * *
  updateTemplate: 0 0 * * 1
  updates: 0 3 * * *
  uptime: '*/5 * * * *'
