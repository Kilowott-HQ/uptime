status-website:
  baseUrl: /uptime
  name: Kilowott status
  introTitle: '**Service status**'
  introMessage: 'Real-time uptime and response-time for Kilowott services.

    Maintained by the Kilowott DevOps team. Updated every 5 minutes.

    '
  navbar:
  - title: Status
    href: /uptime/
  - title: GitHub
    href: https://github.com/Kilowott-HQ/uptime
workflowSchedule:
  graphs: 0 0 * * *
  responseTime: 0 23 * * *
  staticSite: 0 1 * * *
  summary: 0 0 * * *
  updateTemplate: 0 0 * * 1
  updates: 0 3 * * *
  uptime: '*/5 * * * *'
