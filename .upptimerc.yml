status-website:
  baseUrl: /uptime
  name: Kilowott status
  introTitle: '**Service status**'
  introMessage: 'Real-time uptime and response-time for Kilowott services.

    Maintained by the Kilowott DevOps team. Updated every 5 minutes.

    '
  navbar:
  - title: Status
    href: /uptime/
  - title: GitHub
